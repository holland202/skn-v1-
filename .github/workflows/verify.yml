name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install numpy scipy matplotlib dilithium-py
      - name: unit tests (23)
        run: python3 tests/run_tests.py
      - name: the docking tests must not have been skipped
        run: python3 tests/run_tests.py 2>&1 | grep -q "Ran 23 tests" && ! (python3 tests/run_tests.py 2>&1 | grep -q skipped)
