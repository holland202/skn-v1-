name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install numpy scipy matplotlib dilithium-py
      - name: unit tests (29)
        run: python3 tests/run_tests.py
      - name: the docking tests must not have been skipped
        run: python3 tests/run_tests.py 2>&1 | grep -q "Ran 29 tests" && ! (python3 tests/run_tests.py 2>&1 | grep -q skipped)
      - name: K4 vault window (docs/PREREG_2026-10-05.md)
        run: python3 scripts/k4_vault_window.py
      - name: K4 sabotage must exit 1
        run: |
          if python3 scripts/k4_vault_window.py --sabotage > /dev/null; then echo "sabotage passed: probe is vacuous"; exit 1; fi
      - name: K5 topology guard vs standard rivals (docs/PREREG_2026-10-05b.md)
        run: python3 scripts/k5_guard_vs_rivals.py
      - name: K5 sabotage must exit 1
        run: |
          if python3 scripts/k5_guard_vs_rivals.py --sabotage > /dev/null; then echo "sabotage passed: probe is vacuous"; exit 1; fi
      - name: K3 closed loop through thrusters
        run: python3 scripts/k3_closed_loop.py
      - name: K3 sabotage must exit 1
        run: |
          if python3 scripts/k3_closed_loop.py --sabotage > /dev/null; then echo "sabotage passed: probe is vacuous"; exit 1; fi
      - name: K6 vault file
        run: python3 scripts/k6_vault_file.py
      - name: K6 sabotage must exit 1
        run: |
          if python3 scripts/k6_vault_file.py --sabotage > /dev/null; then echo "sabotage passed: probe is vacuous"; exit 1; fi
      - name: package installs from pyproject.toml alone
        run: pip install . && python3 -c "import skn, dilithium_py; print('install ok')"
